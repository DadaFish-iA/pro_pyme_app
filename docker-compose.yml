version: '3.8'

services:
  backend:
    build: ./backend
    container_name: propyme_backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./backend/pro_pyme.db:/app/pro_pyme.db
      - ./backend/static:/app/static  # <-- NUEVO: Guarda las fotos fuera del contenedor

  frontend:
    build: ./frontend
    container_name: propyme_frontend
    restart: unless-stopped
    ports:
      - "5176:80"
    depends_on:
      - backend